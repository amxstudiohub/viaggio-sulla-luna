name: Pubblica su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assembla il sito (solo il runtime)
        run: |
          mkdir -p _site
          cp index.html main.js _site/
          cp -r core systems ui styles data assets _site/
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${ steps.out.outputs.page_url }
    steps:
      - id: out
        uses: actions/deploy-pages@v4
